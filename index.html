<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>강의실 예약 시스템</title>

    <!-- 아이콘 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="style.css" />

    <!-- 라즈베리파이 화면 잘림 보정 -->
    <style>
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* 라즈베리파이 800x480 */
      @media screen and (width: 800px) and (height: 480px) {
        html {
          zoom: 0.9;
        }
      }

      /* 세로 회전 대응 */
      @media screen and (width: 480px) and (height: 800px) {
        html {
          zoom: 0.9;
        }
      }
    </style>
  </head>

  <body>
    <!-- 전체 앱 -->
    <div class="phone-mockup">

      <!-- 상단 -->
      <header>

        <!-- 날짜 이동 -->
        <div class="top-nav">
          <button class="nav-btn" id="prev-day">
            전날
          </button>

          <button
            class="nav-btn today"
            id="today-btn"
          >
            금일
          </button>

          <button class="nav-btn" id="next-day">
            다음날
          </button>
        </div>

        <!-- 헤더 메인 -->
        <div class="header-main">

          <!-- 학교 / 날짜 -->
          <div class="header-info">

            <h2
              style="
                margin: 0;
                font-size: 22px;
                color: #333;
              "
            >
              영진-GSC
            </h2>

            <div
              id="current-date-text"
              style="
                font-size: 20px;
                color: #666;
                font-weight: bold;
              "
            >
              -
            </div>
          </div>

          <!-- 시계 -->
          <div
            class="clock"
            id="live-clock"
          >
            00:00:00
          </div>

          <!-- 전체 예약표 -->
          <button
            class="btn-all"
            id="btn-toggle-all"
          >
            전체 예약표
          </button>
        </div>
      </header>

      <!-- 강의실 탭 -->
      <div class="tabs">

        <div
          class="tab"
          data-room="301"
        >
          301호
        </div>

        <div
          class="tab"
          data-room="405"
        >
          405호
        </div>
      </div>

      <!-- 상태 -->
      <div
        class="status-box"
        id="status-bar"
      >

        <div
          style="
            font-size: 13px;
            margin-bottom: 2px;
          "
        >
          현재
          <span id="room-num-display">
            301
          </span>호
        </div>

        <div
          id="current-status"
          style="font-size: 15px"
        >
          <strong>이용 가능</strong>
        </div>

        <div
          id="status-time"
          style="
            font-size: 11px;
            opacity: 0.9;
            margin-top: 2px;
          "
        >
          -
        </div>
      </div>

      <!-- 시간표 -->
      <div
        class="content"
        id="main-content"
      ></div>

      <!-- 모달 -->
      <div
        class="modal-overlay"
        id="detail-modal"
      >

        <div
          class="modal-content"
          id="modal-container"
        >

          <!-- 닫기 -->
          <span
            class="close-x"
            id="modal-close-x"
          >
            &times;
          </span>

          <!-- 모달 헤더 -->
          <div class="modal-header">

            <div class="icon-box">
              <span id="modal-icon">
                <i class="fa-regular fa-comments"></i>
              </span>
            </div>

            <div class="title-wrap">

              <div
                class="sub-label"
                style="
                  font-size: 11px;
                  opacity: 0.8;
                "
              >
                예약 상세
              </div>

              <div
                class="main-title"
                id="modal-title"
                style="
                  font-size: 17px;
                  font-weight: bold;
                "
              >
                -
              </div>
            </div>
          </div>

          <!-- 정보 -->
          <div class="info-section">

            <div class="info-item">
              <span>
                <i class="fa-regular fa-clock"></i>
              </span>

              <span id="m-time">-</span>
            </div>

            <div class="info-item">
              <span>
                <i class="fa-solid fa-location-dot"></i>
              </span>

              <span id="m-room">-</span>
            </div>

            <div class="info-item">
              <span>
                <i class="fa-regular fa-calendar"></i>
              </span>

              <span id="m-date">-</span>
            </div>
          </div>

          <!-- 예약자 -->
          <div class="info-section user-data">

            <div
              class="section-label"
              style="
                font-size: 11px;
                margin-bottom: 8px;
                opacity: 0.8;
              "
            >
              예약자 정보
            </div>

            <div class="data-row">
              <span>학년</span>
              <span id="m-grade">-</span>
            </div>

            <div class="data-row">
              <span>이름</span>
              <span id="m-name">-</span>
            </div>

            <div class="data-row">
              <span>학번</span>
              <span id="m-id">-</span>
            </div>
          </div>

          <!-- 확인 -->
          <button
            class="btn-footer-close"
            id="modal-close-btn"
          >
            확인
          </button>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="config.js"></script>

    <script src="script.js"></script>

    <!-- 구글 캘린더 -->
    <script
      async
      defer
      src="https://apis.google.com/js/api.js"
      onload="gapiLoaded()"
    ></script>

    <!-- 자동 새로고침 -->
    <script>
      setInterval(() => {
        location.reload();
      }, 300000);
    </script>
  </body>
</html>
